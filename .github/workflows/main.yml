name: Build and Release

on:
  push:
    branches: ["**"]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Build Executable
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: wizard_vs_irs/run.py
          nofollow-import-to: "*tk*,_codecs,encodings,multiprocessing,gi"
          disable-plugins: tk-inter,dill-compat,eventlet,gevent,pyqt5,pyqt6,pyside2,pyside6,delvewheel,pywebview,matplotlib,spacy,enum-compat,pbr-compat,gevent,pmw-freezer,transformers,upx,kivy,options-nanny,multiprocessing,gi
          include-data-dir: wizard_vs_irs/assets=wizard_vs_irs/assets
          include-data-files: CREDITS=CREDITS
          mode: onefile
          output-file: WizardvsIRS

      - name: Zip Build Output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zip_output
          shopt -s nullglob
          files=(build/WizardvsIRS*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No onefile output found in build/"
            ls -la build
            exit 1
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell.exe -Command "Compress-Archive -Path 'build/WizardvsIRS*' -DestinationPath 'zip_output/WizardvsIRS-${{ runner.os }}.zip'"
          else
            cd build
            zip -r "../zip_output/WizardvsIRS-${{ runner.os }}.zip" WizardvsIRS*
          fi

      - name: Upload Zipped Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WizardvsIRS-${{ runner.os }}.zip
          path: zip_output/WizardvsIRS-${{ runner.os }}.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Zipped Builds
        uses: actions/download-artifact@v4
        with:
          path: downloads

      - name: Move latest tag and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="latest"
          echo "Target release tag: $TAG (commit $GITHUB_SHA)"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          NOTES="Most recent multi-platform builds of WizardvsIRS"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "Latest Build" --notes "$NOTES" --verify-tag
          fi
          gh release upload "$TAG" downloads/**/WizardvsIRS-*.zip --clobber
